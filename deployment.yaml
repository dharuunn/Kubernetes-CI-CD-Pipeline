apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-calculator-deployment
  labels:
    app: shopping-calculator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shopping-calculator
  template:
    metadata:
      labels:
        app: shopping-calculator
    spec:
      containers:
      - name: shopping-calculator
        image: juicedabba/shopping-calculator:v2
        ports:
        - containerPort: 80

apiVersion: v1
kind: Service
metadata:
  name: shopping-calculator-service
spec:
  type: NodePort
  selector:
    app: shopping-calculator
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
